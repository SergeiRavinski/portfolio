name: CI
on:
    pull_request:
        types: [opened, synchronize, reopened, ready-for-review]

        # Manual trigger on GitHub Actions UI
        workflow_dispatch: {}
    push:
        branches:
            - main

jobs:
    frontend-tests:
        name: Frontend Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              # Use plugin to checkout the repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              # Use plugin to setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  # Cache dependencies for faster builds

            - name: Install dependencies
              run: npm ci

            - name: Run frontend tests
              run: npm run test
